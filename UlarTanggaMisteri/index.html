<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>Ular Tangga Misteri</title>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/game.css">
    <style>
        /* LAYAR PERINGATAN LANDSCAPE */
        #rotate-warning {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #3e2723; z-index: 9999999;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; color: white;
        }
        #rotate-warning .icon { font-size: 8rem; margin-bottom: 20px; animation: tilt 2s infinite ease-in-out; }
        #rotate-warning h1 { font-family: 'Lilita One', cursive; font-size: 4rem; color: #f1c40f; margin: 0; }
        #rotate-warning p { font-family: 'Nunito', sans-serif; font-size: 1.8rem; margin-top: 10px; }
        @keyframes tilt { 0% { transform: rotate(0deg); } 50% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } }
        
        /* Jika layar berdiri (portrait), sembunyikan game, munculkan peringatan */
        @media screen and (orientation: portrait) {
            #rotate-warning { display: flex !important; }
            .app-container { display: none !important; }
        }
    </style>
</head>
<body>
    <!-- LAYAR PEMAKSA LANDSCAPE -->
    <div id="rotate-warning">
        <div class="icon">📱</div>
        <h1>PUTAR HP KAMU!</h1>
        <p>Miringkan HP ke mode Landscape (Tiduran)<br>untuk memainkan game ini.</p>
    </div>

    <div class="app-container menu-app">
        
        <header class="title-container-custom">
            <div class="title-ular">ULAR</div>
            <div class="title-tangga">TANGGA</div>
            <div class="title-misteri-box">
                <span class="dice-decor">🎲</span>
                <span class="text-misteri">MISTERI</span>
                <span class="dice-decor">🎲</span>
            </div>
        </header>

        <div class="tagline-box">Awas ular, cari tangga,<br>dan temukan kartu misteri!</div>

        <main class="menu-buttons-custom">
            <button class="menu-btn btn-green" onclick="openSetup()">
                <div class="btn-inner"><div class="text">MULAI</span></div>
            </button>
            <button class="menu-btn btn-orange" onclick="openCardGallery()">
                <div class="btn-inner"><div class="text">KARTU</span></div>
            </button>
            <button class="menu-btn btn-blue" onclick="openSettings()">
                <div class="btn-inner"><div class="text">PENGATURAN</span></div>
            </button>
            <button class="menu-btn btn-tan" onclick="alert('Terima Kasih sudah bermain!')">
                <div class="btn-inner"><div class="text">KELUAR</span></div>
            </button>
        </main>


        <!-- MODAL SETUP -->
        <div id="setup-modal" class="modal-overlay" style="display: none;">
            <div class="modal-box">
                <h2>LOBBY PEMAIN</h2>
                <div class="player-count-selector">
                    <span>JUMLAH PEMAIN:</span>
                    <button class="pc-btn" id="pc-btn-2" onclick="setPlayerCount(2)">2</button>
                    <button class="pc-btn" id="pc-btn-3" onclick="setPlayerCount(3)">3</button>
                    <button class="pc-btn" id="pc-btn-4" onclick="setPlayerCount(4)">4</button>
                </div>
                <div id="player-config-list"></div>
                <div class="modal-actions">
                    <button class="menu-btn btn-green" onclick="startGame()"><div class="btn-inner" style="height: 45px;"><span class="text" style="font-size: 1.2rem;">GAS MAIN!</span></div></button>
                    <button class="menu-btn btn-orange" onclick="closeSetup()"><div class="btn-inner" style="height: 45px;"><span class="text" style="font-size: 1.2rem;">BATAL</span></div></button>
                </div>
            </div>
        </div>

        <!-- MODAL GALLERY -->
        <div id="cards-modal" class="modal-overlay" style="display: none;">
            <div class="modal-box modal-large">
                <h2>KOLEKSI KARTU MISTERI</h2>
                <div id="card-gallery-list" class="gallery-grid"></div>
                <div class="modal-actions" style="justify-content: center; margin-top: 15px;">
                    <button class="menu-btn btn-tan" onclick="closeCardGallery()" style="max-width: 250px;">
                        <div class="btn-inner" style="height: 45px;"><span class="text" style="font-size: 1.2rem;">TUTUP KEMBALI</span></div>
                    </button>
                </div>
            </div>
        </div>

        <!-- MODAL PENGATURAN -->
        <div id="settings-modal" class="modal-overlay" style="display: none;">
            <div class="modal-box">
                <h2>PENGATURAN</h2>
                <div class="player-row">
                    <div class="pr-info"><span class="pr-avatar">🎵</span><span class="pr-name">Musik Latar (BGM)</span></div>
                    <button id="btn-bgm" class="player-type-btn human-color" onclick="toggleBGM()">NYALA</button>
                </div>
                <div class="player-row">
                    <div class="pr-info"><span class="pr-avatar">🔊</span><span class="pr-name">Efek Suara (SFX)</span></div>
                    <button id="btn-sfx" class="player-type-btn human-color" onclick="toggleSFX()">NYALA</button>
                </div>
                <div class="modal-actions" style="margin-top: 20px;">
                    <button class="menu-btn btn-orange" onclick="closeSettings()">
                        <div class="btn-inner" style="height: 45px;"><span class="text" style="font-size: 1.2rem;">SIMPAN & TUTUP</span></div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- LOGIKA MENU -->
    <script>
        const FILE_MUSIK_KAMU = 'audio/Pirates.mp3'; 
        
        const MenuSound = {
            bgm: null,
            init: function() {
                let isBgmOn = localStorage.getItem('utm_bgm') !== 'false';
                if (isBgmOn && !this.bgm) {
                    this.bgm = new Audio(FILE_MUSIK_KAMU);
                    this.bgm.loop = true; 
                    this.bgm.volume = 0.3; 
                    this.bgm.play().catch(e => console.log("Menunggu klik dari user..."));
                }
            },
            toggle: function() {
                let isBgmOn = localStorage.getItem('utm_bgm') !== 'false';
                if (isBgmOn) {
                    if (!this.bgm) this.init();
                    else this.bgm.play().catch(e=>{});
                } else {
                    if (this.bgm) { this.bgm.pause(); this.bgm = null; }
                }
            }
        };

        document.body.addEventListener('click', () => { 
            try { MenuSound.init(); } catch(e){} 
        }, { once: true });

        let bgmOn = localStorage.getItem('utm_bgm') !== 'false';
        let sfxOn = localStorage.getItem('utm_sfx') !== 'false';

        function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; updateSettingsUI(); }
        function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }
        
        function toggleBGM() { bgmOn = !bgmOn; localStorage.setItem('utm_bgm', bgmOn); updateSettingsUI(); MenuSound.toggle(); }
        function toggleSFX() { sfxOn = !sfxOn; localStorage.setItem('utm_sfx', sfxOn); updateSettingsUI(); }
        
        function updateSettingsUI() {
            const btnBGM = document.getElementById('btn-bgm'); const btnSFX = document.getElementById('btn-sfx');
            if (bgmOn) { btnBGM.className = 'player-type-btn human-color'; btnBGM.innerText = 'NYALA ✅'; } 
            else { btnBGM.className = 'player-type-btn bot-color'; btnBGM.innerText = 'MATI ❌'; }
            if (sfxOn) { btnSFX.className = 'player-type-btn human-color'; btnSFX.innerText = 'NYALA ✅'; } 
            else { btnSFX.className = 'player-type-btn bot-color'; btnSFX.innerText = 'MATI ❌'; }
        }

        let playerCount = 4;
        let playerConfigs = [ { isBot: false }, { isBot: true }, { isBot: true }, { isBot: true } ];

        function openSetup() { document.getElementById('setup-modal').style.display = 'flex'; renderSetup(); }
        function closeSetup() { document.getElementById('setup-modal').style.display = 'none'; }
        function setPlayerCount(count) { playerCount = count; renderSetup(); }
        function togglePlayerType(index) { playerConfigs[index].isBot = !playerConfigs[index].isBot; renderSetup(); }
        
        function renderSetup() {
            document.querySelectorAll('.pc-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('pc-btn-' + playerCount).classList.add('active');
            let html = '';
            for (let i = 0; i < playerCount; i++) {
                let isBot = playerConfigs[i].isBot;
                html += `<div class="player-row"><div class="pr-info"><span class="pr-avatar">${isBot ? '🤖' : '👦🏻'}</span><span class="pr-name">P${i+1}</span></div><button class="player-type-btn ${isBot ? 'bot-color' : 'human-color'}" onclick="togglePlayerType(${i})">${isBot ? 'BOT' : 'MANUSIA'} 🔄</button></div>`;
            }
            document.getElementById('player-config-list').innerHTML = html;
        }
        
        function startGame() {
            try {
                let colors = ["#3498db", "#e74c3c", "#2ecc71", "#f1c40f"];
                let setupData = [];
                for (let i = 0; i < playerCount; i++) {
                    let isBot = playerConfigs[i].isBot;
                    setupData.push({ id: i, isBot: isBot, avatar: isBot ? '🤖' : '👦🏻', name: `P${i+1} (${isBot ? 'Bot' : 'Kamu'})`, color: colors[i] });
                }
                try { sessionStorage.setItem('gameSetup', JSON.stringify(setupData)); } catch(err) {}
                window.location.href = 'game.html'; 
            } catch(e) { window.location.href = 'game.html'; }
        }

        const galleryCards = [
            { name: "Mode Dewa", desc: "Pilih 1 dari semua!", type: "good", icon: "👼" }, { name: "Naik Tangga", desc: "Maju ke tangga terdekat", type: "good", icon: "🪜" }, { name: "Anti Ular", desc: "Kebal ular 1x", type: "good", icon: "🛡️" }, { name: "Double Dice", desc: "Dadu x2", type: "good", icon: "🎲x2" }, { name: "Triple Dice", desc: "Dadu x3", type: "good", icon: "🎲x3" }, { name: "Teleport 10", desc: "Maju 10 petak", type: "good", icon: "🚀" }, { name: "Lompat Ular", desc: "Lewati ular", type: "good", icon: "🦘" }, { name: "Perisai Dewa", desc: "Kebal 2x", type: "good", icon: "🔮" }, { name: "Putar Ulang", desc: "Reroll < 4", type: "good", icon: "🔄" }, { name: "Tangga Emas", desc: "Ke puncak", type: "good", icon: "🌟" }, { name: "Bonus Giliran", desc: "Main 2x", type: "good", icon: "➕" }, { name: "Hadiah Misteri", desc: "2 kartu", type: "good", icon: "🎁" }, { name: "Kutukan Ular", desc: "Mundur 10", type: "bad", icon: "🐍" }, { name: "Freeze", desc: "Beku 1x", type: "bad", icon: "❄️" }, { name: "Mundur Dadu", desc: "Jalan mundur", type: "bad", icon: "🔙" }, { name: "Hujan Petir", desc: "Semua mundur 3", type: "bad", icon: "⛈️" }, { name: "Racun Ular", desc: "Beku 2x", type: "bad", icon: "🧪" }, { name: "Dadu Rusak", desc: "Maks 3", type: "bad", icon: "💥" }, { name: "Badai Pasir", desc: "Mundur 5", type: "bad", icon: "🌪️" }, { name: "Kutukan Gelap", desc: "Hapus 1 kartu", type: "bad", icon: "🌑" }, { name: "Jaring Laba", desc: "Kunci 2x", type: "bad", icon: "🕸️" }, { name: "Tangga Palsu", desc: "Jebakan", type: "bad", icon: "💔" }, { name: "Gempa Bumi", desc: "Semua mundur 5", type: "bad", icon: "🫨" }, { name: "Serangan Naga", desc: "Jatuh bebas", type: "bad", icon: "🐉" }
        ];

        function openCardGallery() {
            document.getElementById('cards-modal').style.display = 'flex';
            let html = ''; galleryCards.forEach(c => { html += `<div class="gallery-card ${c.type}"><div class="icon">${c.icon}</div><div class="name">${c.name}</div><div class="desc">${c.desc}</div></div>`; });
            document.getElementById('card-gallery-list').innerHTML = html;
        }
        function closeCardGallery() { document.getElementById('cards-modal').style.display = 'none'; }
    </script>
</body>
</html>
